<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-Moms Journey</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- ===== Color Banner ===== -->
    <header class="tm-banner">
        <h1>✨ Tech-Moms Journey ✨</h1>
        <p>Fun, growth, and boss-lady energy all in one place!</p>
    </header>

    <!-- ===== Hero Slideshow ===== -->
    <section class="tm-slideshow">
        <div class="slides fade">
            <img src="Images/5 year celebration.jpg" alt="5 year celebration">

        </div>
        <div class="slides fade">
            <img src="Images/Tools and Tech.jpg" alt="Tools and Tech">
        </div>
        <div class="slides fade">
            <img src="Images/Sleeping.jpg" alt="Sleeping">
        </div>
        <div class="slides fade">
            <img src="Images/Alicia.jpg" alt="Alicia">
        </div>
        <div class="slides fade">
            <img src="Images/Trisha.jpg" alt="Trisha">
        </div>

        <!-- Next/Prev buttons -->
        <a class="prev" onclick="plusSlides(-1)">❮</a>
        <a class="next" onclick="plusSlides(1)">❯</a>
    </section>

    <!-- ===== Gallery Thumbnails ===== -->
    <section class="tm-gallery">
        <h2>All Moments</h2>
        <div class="gallery">
            <img src="Images/5 year celebration 2.jpg" alt="5 year celebration 2">
            <img src="Images/code.jpg" alt="code">
            <img src="images/degreed.jpg" alt="degreed">
            <img src="Images/glasses.jpg" alt="glasses">
            <img src="Images/class.jpg" alt="class">
            <img src="Images/lunch.jpg" alt="lunch">
            <img src="Images/learning code.jpg" alt="learning code">
            <img src="Images/more code.jpg" alt="more code">
            <img src="Images/starbucks study.jpg" alt="starbucks study">
            <img src="Images/study session.jpg" alt="study session">
        </div>
    </section>

    <!-- ===== JS for Slideshow ===== -->
    <script>
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("slides");
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1 }
            slides[slideIndex - 1].style.display = "block";
            setTimeout(showSlides, 3000); // Change image every 3 seconds
        }

        function plusSlides(n) {
            slideIndex += n - 1;
            if (slideIndex < 0) { slideIndex = 0; }
            showSlides();
        }
    </script>
</body>

<!-- Back to Portfolio Button -->
<div class="back-button-wrapper">
    <a href="index.html" class="back-button">← Back to Portfolio Home</a>
</div>

</html>
